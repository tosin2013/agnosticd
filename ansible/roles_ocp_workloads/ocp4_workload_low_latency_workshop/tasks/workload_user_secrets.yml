---
# ============================================================
# User Secrets for Dev Spaces Auto-Mount
# Creates labeled secrets for kubeconfig and SSH keys
# Called in a loop with _user_num variable
# ============================================================

- name: Set user facts for secrets
  ansible.builtin.set_fact:
    _user_name: "{{ ocp4_workload_low_latency_workshop_user_base }}{{ _user_num }}"
    _user_namespace: "{{ ocp4_workload_low_latency_workshop_namespace_prefix }}{{ ocp4_workload_low_latency_workshop_user_base }}{{ _user_num }}"
    _sno_guid: "workshop-{{ ocp4_workload_low_latency_workshop_user_base }}{{ _user_num }}"

- name: Set SNO credential paths
  ansible.builtin.set_fact:
    _sno_kubeconfig_path: >-
      {{ ocp4_workload_low_latency_workshop_sno_output_dir }}/{{ _sno_guid }}/kubeconfig
    _sno_ssh_key_path: >-
      {{ ocp4_workload_low_latency_workshop_sno_output_dir }}/{{ _sno_guid }}/ssh_provision_{{ _sno_guid }}

- name: Check if SNO kubeconfig exists
  ansible.builtin.stat:
    path: "{{ _sno_kubeconfig_path }}"
  register: _kubeconfig_stat
  delegate_to: localhost

- name: Check if SSH key exists
  ansible.builtin.stat:
    path: "{{ _sno_ssh_key_path }}"
  register: _ssh_key_stat
  delegate_to: localhost

- name: Create kubeconfig secret for Dev Spaces auto-mount
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: v1
      kind: Secret
      metadata:
        name: "{{ _user_name }}-kubeconfig"
        namespace: "{{ _user_namespace }}"
        labels:
          workshop: low-latency
          student: "{{ _user_name }}"
          managed-by: agnosticd
          controller.devfile.io/mount-to-devworkspace: "true"
          controller.devfile.io/watch-secret: "true"
        annotations:
          controller.devfile.io/mount-path: "{{ ocp4_workload_low_latency_workshop_devspaces_kubeconfig_mount_path }}"
          controller.devfile.io/mount-as: subpath
      data:
        config: "{{ lookup('file', _sno_kubeconfig_path) | b64encode }}"
      type: Opaque
  when:
    - ocp4_workload_low_latency_workshop_devspaces_mount_kubeconfig | bool
    - _kubeconfig_stat.stat.exists

- name: Create kubeconfig placeholder secret if SNO not deployed
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: v1
      kind: Secret
      metadata:
        name: "{{ _user_name }}-kubeconfig"
        namespace: "{{ _user_namespace }}"
        labels:
          workshop: low-latency
          student: "{{ _user_name }}"
          managed-by: agnosticd
          status: placeholder
          controller.devfile.io/mount-to-devworkspace: "true"
          controller.devfile.io/watch-secret: "true"
        annotations:
          controller.devfile.io/mount-path: "{{ ocp4_workload_low_latency_workshop_devspaces_kubeconfig_mount_path }}"
          controller.devfile.io/mount-as: subpath
          description: "Placeholder - will be updated when SNO is deployed"
      stringData:
        config: |
          # Placeholder kubeconfig - SNO cluster not yet deployed
          apiVersion: v1
          kind: Config
          clusters: []
          contexts: []
          current-context: ""
          users: []
      type: Opaque
  when:
    - ocp4_workload_low_latency_workshop_devspaces_mount_kubeconfig | bool
    - not _kubeconfig_stat.stat.exists

- name: Create SSH key secret for Dev Spaces auto-mount
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: v1
      kind: Secret
      metadata:
        name: "{{ _user_name }}-ssh-key"
        namespace: "{{ _user_namespace }}"
        labels:
          workshop: low-latency
          student: "{{ _user_name }}"
          managed-by: agnosticd
          controller.devfile.io/mount-to-devworkspace: "true"
          controller.devfile.io/watch-secret: "true"
        annotations:
          controller.devfile.io/mount-path: "{{ ocp4_workload_low_latency_workshop_devspaces_ssh_mount_path }}"
          controller.devfile.io/mount-as: subpath
      data:
        id_rsa: "{{ lookup('file', _sno_ssh_key_path) | b64encode }}"
      type: Opaque
  when:
    - ocp4_workload_low_latency_workshop_devspaces_mount_ssh_key | bool
    - _ssh_key_stat.stat.exists

- name: Create SSH key placeholder secret if not available
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: v1
      kind: Secret
      metadata:
        name: "{{ _user_name }}-ssh-key"
        namespace: "{{ _user_namespace }}"
        labels:
          workshop: low-latency
          student: "{{ _user_name }}"
          managed-by: agnosticd
          status: placeholder
          controller.devfile.io/mount-to-devworkspace: "true"
          controller.devfile.io/watch-secret: "true"
        annotations:
          controller.devfile.io/mount-path: "{{ ocp4_workload_low_latency_workshop_devspaces_ssh_mount_path }}"
          controller.devfile.io/mount-as: subpath
          description: "Placeholder - will be updated when SNO is deployed"
      stringData:
        id_rsa: "# Placeholder SSH key - SNO cluster not yet deployed"
      type: Opaque
  when:
    - ocp4_workload_low_latency_workshop_devspaces_mount_ssh_key | bool
    - not _ssh_key_stat.stat.exists

- name: Create SNO connection info ConfigMap
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: v1
      kind: ConfigMap
      metadata:
        name: "{{ _user_name }}-sno-info"
        namespace: "{{ _user_namespace }}"
        labels:
          workshop: low-latency
          student: "{{ _user_name }}"
          managed-by: agnosticd
          controller.devfile.io/mount-to-devworkspace: "true"
          controller.devfile.io/watch-configmap: "true"
        annotations:
          controller.devfile.io/mount-path: /home/user/sno-info
          controller.devfile.io/mount-as: subpath
      data:
        SNO_GUID: "{{ _sno_guid }}"
        SNO_API_URL: "https://api.{{ _sno_guid }}.{{ ocp4_workload_low_latency_workshop_subdomain_base_suffix | regex_replace('^\\.', '') }}:6443"
        SNO_CONSOLE_URL: "https://console-openshift-console.apps.{{ _sno_guid }}.{{ ocp4_workload_low_latency_workshop_subdomain_base_suffix | regex_replace('^\\.', '') }}"
        USER_NAME: "{{ _user_name }}"
        KUBECONFIG_READY: "{{ 'true' if _kubeconfig_stat.stat.exists else 'false' }}"
        SSH_KEY_READY: "{{ 'true' if _ssh_key_stat.stat.exists else 'false' }}"

- name: Display secrets creation status
  ansible.builtin.debug:
    msg:
      - "Secrets created for: {{ _user_name }}"
      - "Namespace: {{ _user_namespace }}"
      - "Kubeconfig: {{ 'Available' if _kubeconfig_stat.stat.exists else 'Placeholder' }}"
      - "SSH Key: {{ 'Available' if _ssh_key_stat.stat.exists else 'Placeholder' }}"

