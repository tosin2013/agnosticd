---
# ============================================================
# Dev Spaces Installation
# Installs OpenShift Dev Spaces operator and CheCluster
# ============================================================

- name: Create Dev Spaces namespace
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: v1
      kind: Namespace
      metadata:
        name: "{{ ocp4_workload_low_latency_workshop_devspaces_namespace }}"
        labels:
          workshop: low-latency
          managed-by: agnosticd

- name: Create Dev Spaces OperatorGroup (AllNamespaces mode)
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: operators.coreos.com/v1
      kind: OperatorGroup
      metadata:
        name: devspaces-operator
        namespace: "{{ ocp4_workload_low_latency_workshop_devspaces_namespace }}"
      spec: {}

- name: Create Dev Spaces Subscription
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: operators.coreos.com/v1alpha1
      kind: Subscription
      metadata:
        name: devspaces
        namespace: "{{ ocp4_workload_low_latency_workshop_devspaces_namespace }}"
        labels:
          workshop: low-latency
          managed-by: agnosticd
      spec:
        channel: "{{ ocp4_workload_low_latency_workshop_devspaces_channel }}"
        installPlanApproval: Automatic
        name: devspaces
        source: redhat-operators
        sourceNamespace: openshift-marketplace

- name: Wait for Dev Spaces operator to be installed
  kubernetes.core.k8s_info:
    api_version: operators.coreos.com/v1alpha1
    kind: ClusterServiceVersion
    namespace: "{{ ocp4_workload_low_latency_workshop_devspaces_namespace }}"
    label_selectors:
      - "operators.coreos.com/devspaces.{{ ocp4_workload_low_latency_workshop_devspaces_namespace }}"
  register: _devspaces_csv
  until:
    - _devspaces_csv.resources | length > 0
    - _devspaces_csv.resources[0].status.phase is defined
    - _devspaces_csv.resources[0].status.phase == "Succeeded"
  retries: 60
  delay: 10

- name: Display operator installation status
  ansible.builtin.debug:
    msg:
      - "Dev Spaces operator installed"
      - "CSV: {{ _devspaces_csv.resources[0].metadata.name }}"

- name: Wait for CheCluster CRD to be available
  kubernetes.core.k8s_info:
    api_version: apiextensions.k8s.io/v1
    kind: CustomResourceDefinition
    name: checlusters.org.eclipse.che
  register: _checluster_crd
  until:
    - _checluster_crd.resources | length > 0
  retries: 30
  delay: 5

- name: Create CheCluster instance
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: org.eclipse.che/v2
      kind: CheCluster
      metadata:
        name: "{{ ocp4_workload_low_latency_workshop_devspaces_checluster_name }}"
        namespace: "{{ ocp4_workload_low_latency_workshop_devspaces_namespace }}"
        labels:
          workshop: low-latency
          managed-by: agnosticd
      spec:
        components:
          cheServer:
            debug: false
            logLevel: INFO
          dashboard:
            headerMessage:
              show: true
              text: "Low-Latency Performance Workshop - Dev Spaces"
          pluginRegistry:
            openVSXURL: "https://open-vsx.org"
        devEnvironments:
          startTimeoutSeconds: 600
          maxNumberOfRunningWorkspacesPerUser: "{{ ocp4_workload_low_latency_workshop_devspaces_max_workspaces_per_user }}"
          maxNumberOfWorkspacesPerUser: -1
          secondsOfInactivityBeforeIdling: "{{ ocp4_workload_low_latency_workshop_devspaces_idle_timeout }}"
          secondsOfRunBeforeIdling: -1
          storage:
            pvcStrategy: "{{ ocp4_workload_low_latency_workshop_devspaces_storage_strategy }}"
          defaultNamespace:
            autoProvision: true
            template: "<username>-devspaces"
          defaultComponents:
            - name: dev-tools
              container:
                image: quay.io/devspaces/udi-rhel8:latest
                memoryLimit: 4Gi
                memoryRequest: 1Gi
                cpuLimit: "2"
                cpuRequest: 500m
                mountSources: true
                sourceMapping: /projects
        networking:
          auth:
            gateway:
              configLabels:
                app: che
                component: che-gateway-config

- name: Wait for CheCluster to be ready
  kubernetes.core.k8s_info:
    api_version: org.eclipse.che/v2
    kind: CheCluster
    name: "{{ ocp4_workload_low_latency_workshop_devspaces_checluster_name }}"
    namespace: "{{ ocp4_workload_low_latency_workshop_devspaces_namespace }}"
  register: _checluster_status
  until:
    - _checluster_status.resources | length > 0
    - _checluster_status.resources[0].status is defined
    - _checluster_status.resources[0].status.chePhase is defined
    - _checluster_status.resources[0].status.chePhase == "Active"
  retries: 60
  delay: 15

- name: Get Dev Spaces URL
  ansible.builtin.set_fact:
    _ocp4_workload_low_latency_workshop_devspaces_url: >-
      {{ _checluster_status.resources[0].status.cheURL | default('') }}

- name: Display Dev Spaces setup complete
  ansible.builtin.debug:
    msg:
      - "Dev Spaces installation complete"
      - "Dashboard URL: {{ _ocp4_workload_low_latency_workshop_devspaces_url }}"
      - "Max workspaces per user: {{ ocp4_workload_low_latency_workshop_devspaces_max_workspaces_per_user }}"

